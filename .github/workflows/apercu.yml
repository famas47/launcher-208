name: Aperçus de la carte

# Dessine des exemples de styles pour la minimap (sur la branche « apercu » seulement).
# Ne touche pas à l'appli ni aux versions installables.
on:
  push:
    branches: [ apercu ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apercu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7.0.1

      - name: Installer Java 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Carte de Belgique
        run: curl -fsSL --retry 3 -o belgium.map https://download.mapsforge.org/maps/v5/europe/belgium.map && ls -l belgium.map

      - name: Moteur Mapsforge pour ordinateur
        working-directory: apercu
        run: |
          for v in 0.31.0 0.30.0 0.25.0 0.21.0; do
            if mvn -q -B -Dmapsforge.version=$v dependency:copy-dependencies -DoutputDirectory=lib; then echo "mapsforge $v"; break; fi
          done
          ls lib

      - name: Dessiner les aperçus
        working-directory: apercu
        run: |
          javac -cp "lib/*" -d out Apercu.java
          mkdir -p png
          LAT=50.4542; LON=3.95564
          for t in themes/*.xml; do
            n=$(basename "$t" .xml)
            java -Djava.awt.headless=true -cp "out:lib/*" Apercu ../belgium.map "$t" $LAT $LON 16 680 360 "png/$n.png"
            java -Djava.awt.headless=true -cp "out:lib/*" Apercu ../belgium.map "$t" $LAT $LON 16 1100 1100 "png/$n-grand.png"
          done
          ls -l png
          zip -qr ../apercu-carte-${{ github.run_number }}.zip png

      - name: Supprimer les anciens brouillons d'aperçu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.draft and (.tag_name | startswith("apercu-"))) | .id' |
          while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/releases/$id" && echo "brouillon $id supprimé"; done || true

      - name: Brouillon privé avec les aperçus
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: apercu-${{ github.run_number }}
          name: Aperçus de la carte ${{ github.run_number }} (brouillon, à supprimer)
          draft: true
          make_latest: false
          files: apercu-carte-${{ github.run_number }}.zip
