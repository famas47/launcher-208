name: Vérifier le launcher (Lint + test sur émulateur)

# Contrôle approfondi : ne publie rien, ne touche pas aux versions installables.
# Se lance sur la branche « verification », ou à la main (onglet Actions → Run workflow).
on:
  push:
    branches: [ verification ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7.0.1

      - name: Installer Java 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.11.1'

      - name: Analyse Android Lint
        run: gradle --no-daemon lintDebug

      - name: Résumé
        run: python3 .github/test/resume_lint.py app/build/reports/lint-results-debug.xml | tee lint-resume.txt

      - name: Garder le rapport
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint
          path: |
            lint-resume.txt
            app/build/reports/lint-results-debug.*

  emulateur:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [ 29, 34 ]   # Android 10 (fréquent sur les autoradios) et Android 14
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7.0.1

      - name: Installer Java 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.11.1'

      - name: Fabriquer l'APK de test (version optimisée, avec les commandes de test)
        env:
          TEST_HOOKS: '1'
        run: gradle --no-daemon assembleRelease

      - name: Télécharger la carte de Belgique
        run: curl -fsSL --retry 3 -o belgium.map https://download.mapsforge.org/maps/v5/europe/belgium.map && ls -l belgium.map

      - name: Activer l'accélération de l'émulateur (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tester sur un autoradio simulé 1280x720
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          cores: 4
          ram-size: 2048M
          disk-size: 6000M
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1280x720
          script: python3 .github/test/test_emulateur.py app/build/outputs/apk/release/app-release.apk rapport-api${{ matrix.api }} ${{ matrix.api }} belgium.map

      - name: Garder le rapport
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rapport-api${{ matrix.api }}
          path: rapport-api${{ matrix.api }}

  # Rassemble tous les rapports dans un brouillon de version (privé : visible seulement par le propriétaire,
  # jamais proposé comme mise à jour), pour pouvoir les lire depuis l'extérieur de GitHub Actions.
  rapport:
    needs: [ lint, emulateur ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les rapports
        uses: actions/download-artifact@v8.0.2
        with:
          path: rapports

      - name: Tout mettre dans un seul fichier
        run: cd rapports && zip -qr ../rapport-verification-${{ github.run_number }}.zip . && ls -l ../rapport-verification-*.zip

      - name: Supprimer les anciens brouillons de vérification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.draft and (.tag_name | startswith("verification-"))) | .id' |
          while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/releases/$id" && echo "brouillon $id supprimé"; done || true

      - name: Brouillon privé avec le rapport
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: verification-${{ github.run_number }}
          name: Rapport de vérification ${{ github.run_number }} (brouillon, à supprimer)
          draft: true
          make_latest: false
          files: rapport-verification-${{ github.run_number }}.zip
