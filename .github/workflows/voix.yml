name: Voix du GPS

# Enregistre les phrases du guidage avec la voix choisie (Siwis), pour les mettre dans le launcher.
on:
  push:
    branches: [ voix ]
    paths: [ 'outils/voix/**', '.github/workflows/voix.yml' ]

permissions:
  contents: write

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install --quiet piper-tts
      - name: Enregistrer les phrases
        run: |
          python3 outils/voix/phrases.py sons
          ls sons | wc -l
          du -sh sons
          cp voix/MODEL_CARD sons/MODEL_CARD.txt
          cd sons && zip -q -r ../voix-siwis.zip .
      - name: Brouillon avec les sons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.draft and (.tag_name | startswith("voix-essai-"))) | .id' |
          while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/releases/$id"; done || true
          gh release create "voix-essai-${{ github.run_number }}" --draft --target "${{ github.sha }}" \
            --title "Voix : phrases ${{ github.run_number }}" --notes "Phrases du guidage (privé)." voix-siwis.zip
